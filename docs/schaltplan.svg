<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Segoe UI, Arial, sans-serif">
<style>
  .bx   { fill:#ffffff; stroke:#333333; stroke-width:2; }
  .bxp  { fill:#fdf4f4; stroke:#c62828; stroke-width:2; }   /* Netzseite */
  .bxi  { fill:#faf4fd; stroke:#7b1fa2; stroke-width:2; }   /* isolierte Messseite */
  .bxc  { fill:#f3f8f3; stroke:#2e7d32; stroke-width:2; }   /* Steuerung */
  .t    { font-size:15px; font-weight:700; fill:#111; }
  .s    { font-size:11px; fill:#555; }
  .p    { font-size:11px; fill:#111; }
  .lbl  { font-size:11px; fill:#333; }
  .note { font-size:12px; fill:#444; }
  .warn { font-size:13px; font-weight:700; fill:#c62828; }
  .mains{ stroke:#c62828; stroke-width:3.5; fill:none; }    /* 230 V */
  .w5   { stroke:#ef6c00; stroke-width:2.5; fill:none; }    /* +5 V */
  .wg   { stroke:#000000; stroke-width:3;   fill:none; }    /* GND */
  .wsig { stroke:#1565c0; stroke-width:2;   fill:none; }    /* Signal/I2C */
  .wana { stroke:#2e7d32; stroke-width:2;   fill:none; }    /* Analog */
  .iso  { stroke:#7b1fa2; stroke-width:2.5; fill:none; stroke-dasharray:10 6; }
  .hz   { stroke:#c62828; stroke-width:2;   fill:none; stroke-dasharray:8 5; }
</style>

<rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>
<text x="24" y="32" font-size="22" font-weight="700" fill="#111">pH-Minus-Dosieranlage &#8211; Verdrahtungsplan (Relais / AC-Motor)</text>
<text x="24" y="52" class="note">Ein Geraet: LilyGo T-Display S3 AMOLED &#183; FW 2.3.0 &#183; Kreuzung ohne Punkt = keine Verbindung</text>

<!-- ===== Netz-Gefahrenzone ===== -->
<rect x="24" y="70" width="360" height="250" rx="8" class="hz"/>
<text x="34" y="90" class="warn">&#9888; 230 V &#8211; beruehrungssicher kapseln, Vorsicherung, Fachkraft</text>

<!-- Netzeinspeisung -->
<rect x="40" y="110" width="150" height="80" rx="6" class="bxp"/>
<text x="115" y="140" text-anchor="middle" class="t">230 V ~</text>
<text x="115" y="158" text-anchor="middle" class="s">Shelly-Kreis</text>
<text x="115" y="174" text-anchor="middle" class="s">L &#183; N</text>

<!-- Sicherung -->
<rect x="212" y="118" width="60" height="26" rx="4" class="bxp"/>
<text x="242" y="136" text-anchor="middle" class="lbl">F 1 A T</text>

<!-- TSP-05 -->
<rect x="212" y="210" width="150" height="90" rx="6" class="bxp"/>
<text x="287" y="238" text-anchor="middle" class="t">TSP-05</text>
<text x="287" y="256" text-anchor="middle" class="s">230 V &#8594; 5 V</text>
<text x="287" y="272" text-anchor="middle" class="s">&#8805; 1 A empfohlen</text>
<text x="287" y="288" text-anchor="middle" class="s">(3 W grenzwertig)</text>

<!-- L: Netz -> Sicherung -> TSP AC + Relais COM -->
<path class="mains" d="M 190 131 L 212 131"/>
<path class="mains" d="M 272 131 L 760 131"/>                      <!-- L-Schiene (230 V) -->
<path class="mains" d="M 300 131 L 300 210"/>                      <!-- L zu TSP AC -->
<path class="mains" d="M 760 131 L 760 660 L 712 660"/>           <!-- L zu Relais COM -->
<circle cx="300" cy="131" r="3.5" fill="#c62828"/>
<text x="360" y="126" class="lbl">L (Phase, 230 V)</text>

<!-- N: Netz -> TSP AC + Motor N -->
<path class="mains" d="M 190 170 L 340 170 L 340 210"/>            <!-- N zu TSP AC -->
<path class="mains" d="M 190 170 L 190 740 L 810 740 L 810 700"/> <!-- N zu Motor (unter den Boxen) -->
<circle cx="340" cy="170" r="3.5" fill="#c62828"/>
<text x="360" y="165" class="lbl">N</text>

<!-- ===== 5V / D1 / Cbulk ===== -->
<!-- +Vo -->
<path class="w5" d="M 362 245 L 470 245"/>
<!-- D1 -->
<path d="M 470 245 L 486 237 L 486 253 Z" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="486" y1="237" x2="486" y2="253" stroke="#111" stroke-width="2"/>
<text x="478" y="228" class="lbl">D1</text>
<!-- +5V Bus -->
<path class="w5" d="M 486 245 L 486 360 L 1140 360"/>
<text x="1146" y="364" class="w5" fill="#ef6c00" font-size="12" font-weight="700">+5 V</text>
<!-- Cbulk -->
<path class="w5" d="M 430 245 L 430 268"/>
<line x1="418" y1="268" x2="442" y2="268" stroke="#111" stroke-width="2"/>
<line x1="422" y1="276" x2="438" y2="276" stroke="#111" stroke-width="2"/>
<path class="wg" d="M 430 276 L 430 300"/>
<text x="448" y="266" class="lbl">C_bulk</text>
<text x="448" y="279" class="lbl">470&#8211;1000 &#181;F</text>

<!-- GND-Bus (Sternpunkt) -->
<path class="wg" d="M 120 790 L 1140 790"/>
<text x="1146" y="794" font-size="12" font-weight="700" fill="#000">GND</text>
<text x="126" y="784" class="lbl">Sternpunkt (nur Kleinspannung, NICHT N)</text>
<!-- TSP -Vo -> GND -->
<path class="wg" d="M 362 280 L 400 280 L 400 790"/>
<!-- Cbulk GND -> bus -->
<path class="wg" d="M 430 300 L 430 790"/>

<!-- ===== ESP ===== -->
<rect x="470" y="400" width="240" height="150" rx="6" class="bxc"/>
<text x="590" y="428" text-anchor="middle" class="t">T-Display S3 AMOLED</text>
<text x="590" y="446" text-anchor="middle" class="s">misst &#183; regelt &#183; schaltet &#183; zeigt</text>
<text x="482" y="474" class="p">VBUS(5V)</text>
<text x="482" y="494" class="p">GND</text>
<text x="700" y="474" text-anchor="end" class="p">3V3</text>
<text x="700" y="494" text-anchor="end" class="p">GPIO10</text>
<text x="700" y="514" text-anchor="end" class="p">GPIO13/14</text>
<!-- VBUS from +5V bus -->
<path class="w5" d="M 520 400 L 520 360"/>
<circle cx="520" cy="360" r="3.5" fill="#ef6c00"/>
<!-- GND -->
<path class="wg" d="M 500 550 L 500 790"/>
<circle cx="500" cy="790" r="3.5" fill="#000"/>

<!-- ===== Relais ===== -->
<rect x="470" y="590" width="240" height="120" rx="6" class="bxc"/>
<text x="590" y="616" text-anchor="middle" class="t">1-Kanal-Relais</text>
<text x="590" y="633" text-anchor="middle" class="s">JQC-3FF-S-Z &#183; 5 V &#183; 10 A/250 V</text>
<text x="482" y="660" class="p">S</text>
<text x="482" y="680" class="p">+ (5V)</text>
<text x="482" y="700" class="p">&#8722; (GND)</text>
<text x="700" y="660" text-anchor="end" class="p">COM</text>
<text x="700" y="700" text-anchor="end" class="p">NO</text>
<!-- GPIO10 -> S (Signal) -->
<path class="wsig" d="M 704 490 L 740 490 L 740 655 L 560 655"/>
<text x="744" y="486" class="lbl">Relais-Signal</text>
<!-- 10k Pulldown S -> GND -->
<path class="wsig" d="M 540 655 L 540 730"/>
<rect x="531" y="700" width="18" height="24" fill="#fff" stroke="#111"/>
<text x="524" y="716" text-anchor="end" class="lbl">10k</text>
<path class="wg" d="M 540 724 L 540 790"/>
<!-- + from 5V bus -->
<path class="w5" d="M 600 675 L 600 360"/>
<circle cx="600" cy="360" r="3.5" fill="#ef6c00"/>
<!-- - to GND -->
<path class="wg" d="M 560 695 L 460 695 L 460 790"/>

<!-- ===== Motor ===== -->
<rect x="810" y="598" width="210" height="104" rx="6" class="bxp"/>
<text x="915" y="626" text-anchor="middle" class="t">AC-Synchronmotor</text>
<text x="915" y="644" text-anchor="middle" class="s">230 V &#183; konstante Drehzahl</text>
<text x="915" y="660" text-anchor="middle" class="s">Peristaltikpumpe</text>
<text x="822" y="680" class="p">L</text>
<text x="822" y="700" class="p">N</text>
<!-- Relais NO -> Motor L (230V) -->
<path class="mains" d="M 712 700 L 770 700 L 770 674 L 810 674"/>
<text x="722" y="694" class="lbl">NO</text>
<circle cx="712" cy="700" r="3.5" fill="#c62828"/>
<circle cx="810" cy="695" r="3.5" fill="#c62828"/>

<!-- ===== Isolationsbarriere Messseite ===== -->
<path class="iso" d="M 862 70 L 862 560"/>
<text x="872" y="86" class="p" fill="#7b1fa2" font-weight="700">galvanische Trennung (Messseite)</text>

<!-- Messseiten-Bloecke -->
<rect x="880" y="100" width="250" height="60" rx="6" class="bxi"/>
<text x="1005" y="126" text-anchor="middle" class="t">B0509S</text>
<text x="1005" y="145" text-anchor="middle" class="s">5 V &#8594; 9 V isoliert</text>

<rect x="880" y="180" width="250" height="55" rx="6" class="bxi"/>
<text x="1005" y="205" text-anchor="middle" class="t">AMS1117-5.0</text>
<text x="1005" y="223" text-anchor="middle" class="s">&#8594; +5 V iso</text>

<rect x="880" y="255" width="250" height="70" rx="6" class="bxi"/>
<text x="1005" y="281" text-anchor="middle" class="t">ISO1540</text>
<text x="1005" y="299" text-anchor="middle" class="s">I&#178;C-Trennung (SDA/SCL)</text>
<text x="1005" y="315" text-anchor="middle" class="s">VCC1&#8592;3V3 &#183; VCC2&#8592;5V iso</text>

<rect x="880" y="345" width="250" height="60" rx="6" class="bxi"/>
<text x="1005" y="371" text-anchor="middle" class="t">ADS1115</text>
<text x="1005" y="389" text-anchor="middle" class="s">16 bit &#183; A0 &#8592; PO (R2 10k)</text>

<rect x="880" y="425" width="250" height="60" rx="6" class="bxi"/>
<text x="1005" y="451" text-anchor="middle" class="t">pH-Signalboard</text>
<text x="1005" y="469" text-anchor="middle" class="s">V+ / G / PO</text>

<rect x="880" y="505" width="250" height="50" rx="6" class="bxi"/>
<text x="1005" y="535" text-anchor="middle" class="t">pH-Sonde (BNC)</text>

<!-- +5V bus -> B0509S +Vin -->
<path class="w5" d="M 1090 360 L 1090 160"/>
<circle cx="1090" cy="360" r="3.5" fill="#ef6c00"/>
<text x="1096" y="180" class="lbl">+Vin</text>
<!-- GND bus -> B0509S -Vin (letzte Verbindung zur Netzseite) -->
<path class="wg" d="M 920 790 L 920 160"/>
<circle cx="920" cy="790" r="3.5" fill="#000"/>
<text x="926" y="180" class="lbl">&#8722;Vin</text>

<!-- iso Versorgungskette (vereinfacht) -->
<path class="w5" d="M 1005 160 L 1005 180"/>
<path class="w5" d="M 1005 235 L 1005 255"/>
<path class="w5" d="M 1005 325 L 1005 345"/>
<path class="wana" d="M 1005 405 L 1005 425"/>
<path class="wana" d="M 1005 485 L 1005 505"/>
<text x="1014" y="418" class="lbl">A0/PO</text>

<!-- ISO1540 <-> ESP (Wire1) -->
<path class="wsig" d="M 704 512 L 820 512 L 820 300 L 880 300"/>
<text x="726" y="508" class="lbl">GPIO13/14 (Wire1)</text>
<path class="wsig" d="M 704 470 L 840 470 L 840 285 L 880 285"/>
<text x="726" y="466" class="lbl">3V3 &#8594; VCC1</text>

<!-- ===== Legende ===== -->
<rect x="24" y="360" width="330" height="170" rx="8" fill="#fafafa" stroke="#ccc"/>
<text x="40" y="384" class="t">Legende</text>
<line x1="40" y1="404" x2="80" y2="404" class="mains"/><text x="90" y="408" class="lbl">230 V (Phase/Neutral)</text>
<line x1="40" y1="428" x2="80" y2="428" class="w5"/><text x="90" y="432" class="lbl">+5 V</text>
<line x1="40" y1="452" x2="80" y2="452" class="wg"/><text x="90" y="456" class="lbl">GND (Sternpunkt)</text>
<line x1="40" y1="476" x2="80" y2="476" class="wsig"/><text x="90" y="480" class="lbl">Signal / I&#178;C</text>
<line x1="40" y1="500" x2="80" y2="500" class="wana"/><text x="90" y="504" class="lbl">Analog (pH)</text>
<line x1="200" y1="500" x2="240" y2="500" class="iso"/><text x="248" y="504" class="lbl">Trennstelle</text>

<text x="24" y="820" class="note">Pinbelegung und Netzliste im Detail: SCHALTPLAN.md &#183; Relais aktiv-LOW/HIGH vor Anschluss mit &#8222;run 3&#8220; pruefen (set rinv)</text>
</svg>
